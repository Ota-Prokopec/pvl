# The post-modification checklist (README.md). Jobs run in order and each one
# runs even when an earlier one failed, so a commit attempt reports every failure.
pre-commit:
  jobs:
    - name: format
      run: pnpm format
      stage_fixed: true
    - name: lint
      run: pnpm lint
    - name: check-types
      run: pnpm check-types
    - name: test
      run: pnpm test
    - name: build
      run: pnpm build
