# Publishes both packages when `release` is pushed (ADR-0049, docs/agents/releasing.md).
name: Release

on:
  push:
    branches: [release]

concurrency:
  group: release

permissions:
  contents: write # the vX.Y.Z tag and the GitHub Release
  id-token: write # npm trusted publishing and provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      # No dependency cache: a publishing job restores nothing another workflow wrote.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
      - run: pnpm build --filter=@pcvl/schema --filter=@pcvl/compiler
      - name: Version and dist-tag
        run: |
          version=$(jq -r .version packages/schema/package.json)
          tag=latest prerelease=false
          if [[ $version == *-* ]]; then
            tag=${version#*-}
            tag=${tag%%.*}
            prerelease=true
          fi
          printf 'VERSION=%s\nDIST_TAG=%s\nPRERELEASE=%s\n' "$version" "$tag" "$prerelease" >> "$GITHUB_ENV"
      - run: pnpm -r publish --tag "$DIST_TAG" --provenance --no-git-checks
      - name: Tag and create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "v$VERSION" >/dev/null 2>&1 && exit 0
          for pkg in schema compiler; do
            section=$(awk -v heading="## $VERSION" '$0 == heading { on = 1; next } /^## / { on = 0 } on' "packages/$pkg/CHANGELOG.md")
            if [[ -z ${section//[[:space:]]/} ]]; then
              echo "::error::packages/$pkg/CHANGELOG.md has no '## $VERSION' section"
              exit 1
            fi
            printf '## @pcvl/%s\n%s\n\n' "$pkg" "$section"
          done > "$RUNNER_TEMP/notes.md"
          gh release create "v$VERSION" --target "$GITHUB_SHA" --title "v$VERSION" \
            --notes-file "$RUNNER_TEMP/notes.md" --prerelease="$PRERELEASE"
