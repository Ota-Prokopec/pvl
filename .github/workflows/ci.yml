# The slow half of the post-modification checklist (README.md): lefthook's
# pre-commit hook runs format, lint and check-types locally, and this runs
# test and build on every pull request and push to main.
name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  # The floor in package.json's engines and the current Node (README.md says
  # why the floor is 22.19).
  test-and-build:
    strategy:
      fail-fast: false
      matrix:
        node: ['22.19', 24]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm build

  # A PR changing either published package's code (changedFilePatterns in
  # .changeset/config.json) must carry a changeset; docs and private entries
  # don't need one.
  changeset:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm changeset status --since=origin/main
