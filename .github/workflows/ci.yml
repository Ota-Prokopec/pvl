# The slow half of the post-modification checklist (README.md): lefthook's
# pre-commit hook runs format, lint and check-types locally, and this runs
# test and build on every pull request and push to main. It also checks that a
# pull request changing a published package carries a changeset, and that both
# packages install and work from their packed tarballs.
name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  # The floor in package.json's engines and the current Node (README.md says
  # why the floor is 22.19).
  test-and-build:
    strategy:
      fail-fast: false
      matrix:
        node: ['22.19', 24]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm build

  # A PR changing either published package's code (changedFilePatterns in
  # .changeset/config.json) must carry a changeset; docs and private entries
  # don't need one.
  changeset:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm changeset status --since=origin/main

  # Both packages as a user installs them (ADR-0048): publint and attw check
  # the manifests and per-format types, then a throwaway project outside the
  # workspace, where no `@repo/*` resolves, installs the packed tarballs,
  # compiles a Schema, type-checks against the shipped declarations (so a
  # declaration importing a package the tarball doesn't depend on fails it),
  # and imports both packages as ESM and requires them as CJS.
  tarball:
    strategy:
      fail-fast: false
      matrix:
        node: ['22.19', 24]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build --filter=@pcvl/schema --filter=@pcvl/compiler
      - name: publint
        run: |
          pnpm dlx publint@0.3.25 packages/schema
          pnpm dlx publint@0.3.25 packages/compiler
      - name: Pack
        run: pnpm --filter "@pcvl/*" pack --pack-destination "$RUNNER_TEMP/tarballs"
      - name: attw
        # node10 resolution can't reach the `./json-schema` subpath export.
        run: |
          for tarball in "$RUNNER_TEMP"/tarballs/*.tgz; do
            pnpm dlx @arethetypeswrong/cli@0.18.5 --profile node16 "$tarball"
          done
      - name: Install the tarballs into a project outside the workspace
        working-directory: ${{ runner.temp }}
        run: |
          mkdir -p consumer/src/schemas
          cd consumer
          echo '{ "private": true, "type": "module" }' > package.json
          # Strict, so a peer range that misses the packed `@pcvl/schema` fails the install.
          npm install --strict-peer-deps --no-audit --no-fund "$RUNNER_TEMP"/tarballs/*.tgz typescript@6.0.3
          echo '{}' > pvlconfig.json
          cat > tsconfig.json <<'EOF'
          { "compilerOptions": { "module": "nodenext", "strict": true, "outDir": "out", "types": [] }, "include": ["src"] }
          EOF
          cat > src/schemas/user.ts <<'EOF'
          import { pvl } from '@pcvl/schema';
          export const user = pvl.compile(pvl.object({ name: pvl.string() }));
          EOF
          cat > src/esm.ts <<'EOF'
          import { runCompilation } from '@pcvl/compiler';
          import { pvl } from '@pcvl/schema';
          import { user } from '../.pvl/schemas/user.js';
          if (typeof runCompilation !== 'function') throw new Error('ESM: no runCompilation');
          if (pvl.string().validate('a').issues !== undefined) throw new Error('ESM: interpreted');
          if (user.validate({ name: 'a' }).issues !== undefined) throw new Error('ESM: compiled');
          EOF
          cat > src/cjs.cts <<'EOF'
          import { runCompilation } from '@pcvl/compiler';
          import { pvl } from '@pcvl/schema';
          if (typeof runCompilation !== 'function') throw new Error('CJS: no runCompilation');
          if (pvl.string().validate('a').issues !== undefined) throw new Error('CJS: interpreted');
          EOF
      - name: pvl compile
        working-directory: ${{ runner.temp }}/consumer
        run: npx --no-install pvl compile
      - name: Type-check against the shipped declarations
        working-directory: ${{ runner.temp }}/consumer
        run: npx --no-install tsc
      - name: Import as ESM
        working-directory: ${{ runner.temp }}/consumer
        run: node out/src/esm.js
      - name: Require as CJS
        working-directory: ${{ runner.temp }}/consumer
        run: node out/src/cjs.cjs
