# Publishes docs/wiki/ to the GitHub wiki on every push to main that changes
# it (ADR-0037). The wiki becomes exactly that folder, so a page edited in the
# wiki itself is overwritten: change it here, through a PR (docs/agents/wiki.md).
name: Wiki

on:
  push:
    branches: [main]
    paths: [docs/wiki/**]
  workflow_dispatch:

concurrency:
  group: publish-wiki
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  publish-wiki:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Andrew-Chen-Wang/github-wiki-action@v5
        with:
          path: docs/wiki
