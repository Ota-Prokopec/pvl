# Publishes docs/wiki/ to the GitHub wiki on every push to main that changes
# it or this workflow (ADR-0037). The wiki becomes exactly that folder, so a
# page edited in the wiki itself is overwritten: change it here, through a PR
# (docs/agents/wiki.md).
name: Wiki

on:
  push:
    branches: [main]
    paths: [docs/wiki/**, .github/workflows/wiki.yml]
  workflow_dispatch:

concurrency:
  group: publish-wiki
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  publish-wiki:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # A page links a repo file relatively, which resolves in the repo but not
      # in the wiki, a separate repo: point each such link at the file on main.
      - name: Rewrite repo links to GitHub URLs
        run: >-
          sed -i -E
          -e 's#\]\(\.\./\.\./#](${{ github.server_url }}/${{ github.repository }}/blob/main/#g'
          -e 's#\]\(\.\./#](${{ github.server_url }}/${{ github.repository }}/blob/main/docs/#g'
          docs/wiki/*.md
      - uses: Andrew-Chen-Wang/github-wiki-action@v5
        with:
          path: docs/wiki
