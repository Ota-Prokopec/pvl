% tex4ht config for thesis/web.tex: one page per chapter (option 2), files
% numbered after the jobname `index`, Czech previous/up/next links on each
% chapter page, a "Stáhnout PDF" link on every page, and a link to the site
% stylesheet, which sets headings in Roboto Condensed. Czech babel makes `"` a
% shorthand, so the raw HTML below quotes attributes with `'`.
\Preamble{xhtml,2,charset=utf-8,fn-in}
\Configure{crosslinks*}{prev}{up}{next}{}
\Configure{crosslinks}{}{}{další~→}{←~předchozí}{←~předchozí}{}{}{obsah}
\Configure{crosslinks+}
  {\HCode{<nav class='crosslinks'>}}{\HCode{</nav>}}
  {\HCode{<nav class='crosslinks'>}}{\HCode{</nav>}}
\Configure{@HEAD}{\HCode{<meta name='viewport' content='width=device-width, initial-scale=1' />\Hnewline}}
\Configure{@HEAD}{\HCode{<link rel='stylesheet' href='https://fonts.googleapis.com/css2?family=Roboto+Condensed:wght@400;700&amp;display=swap' />\Hnewline}}
\Configure{@HEAD}{\HCode{<link rel='stylesheet' href='site.css' />\Hnewline}}
\begin{document}
\Configure{@BODY}{\HCode{<nav class='pdf'><a href='pvl-thesis.pdf'>Stáhnout PDF</a></nav>\Hnewline}}
\EndPreamble
